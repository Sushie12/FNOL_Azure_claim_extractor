services:
  postgres:
    image: postgres:17
    container_name: insurance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password890@
      POSTGRES_DB: insurance_analyser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: insurance_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:Password890%40@insurance_postgres:5432/insurance_analyser
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
